#
# Builds and publishes the OSS CRS runner image to GHCR. Runs when the image
# bundle changes, and on demand. When this bundle is extracted to a standalone
# oss-crs-action repo, this workflow moves there unchanged.
name: oss-crs-image

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/oss-crs-scan/runner.Dockerfile"
      - ".github/actions/oss-crs-scan/entrypoint.sh"
      - ".github/workflows/oss-crs-image.yaml"
  workflow_dispatch:

permissions: {}

jobs:
  build-and-push:
    name: Build & push oss-crs-runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/oss-crs-runner"
          ctx=".github/actions/oss-crs-scan"
          docker buildx build \
            --file "${ctx}/runner.Dockerfile" \
            --tag "${image}:latest" \
            --tag "${image}:${GITHUB_SHA}" \
            --push \
            "${ctx}"
          echo "Pushed ${image}:latest and ${image}:${GITHUB_SHA}"
