#
# OSS CRS PR presubmit: short fuzz pass over each harness against the PR's code.
# Uses crs-libfuzzer (no LLM / no secrets) and plain `pull_request` so fork PRs
# never see repository credentials. Path-filtered so unrelated PRs don't pay for it.
#
# NOTE: each matrix job rebuilds the target image independently. That's the price
# of per-harness isolation; a future optimization is to build once and share.
name: oss-crs-presubmit

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "oss-fuzz/**"
      - "test/fuzz/**"
      - ".github/actions/oss-crs-scan/**"
      - ".github/workflows/oss-crs-presubmit.yaml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: oss-crs-presubmit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: "Fuzz ${{ matrix.harness }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pull the oss-crs-runner image from GHCR
    strategy:
      fail-fast: false
      matrix:
        harness:
          - parse_provider_json
          - parse_provider_yaml
          - parse_identity
          - parse_class
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Enables pulling a private GHCR image on same-repo PRs. For external fork
      # PRs the token can't read base-repo packages, so publish the image public.
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - id: scan
        uses: ./.github/actions/oss-crs-scan
        with:
          harness: ${{ matrix.harness }}
          proj-path: oss-fuzz
          timeout: "120"
          fail-on-crash: "true"

      - name: Upload PoV
        if: always() && steps.scan.outputs.crashed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-crs-pov-${{ matrix.harness }}
          path: ${{ steps.scan.outputs.artifacts-dir }}
          if-no-files-found: ignore
