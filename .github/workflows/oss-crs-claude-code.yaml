#
# OSS CRS bug-finding with Claude Code (crs-bug-finding-claude-code), via the
# reusable ossf/oss-crs-actions action. ampel supplies only the target: the
# in-repo OSS-Fuzz project (oss-fuzz/) and harnesses (test/fuzz/). The oss-crs
# CLI, runner image, and CRS compose all come from the action.
#
# This CRS is LLM-driven and needs a secret (CLAUDE_CODE_OAUTH_TOKEN), so it is
# manual-dispatch only and runs in a trusted context — NEVER on fork PRs. It
# costs Claude subscription quota; the run is bounded by `timeout` and the
# compose's llm_budget / AGENT_TIMEOUT.
#
# Setup once:
#   1. Locally: `claude setup-token`
#   2. Repo → Settings → Secrets and variables → Actions → new secret
#      CLAUDE_CODE_OAUTH_TOKEN = <the token>
name: oss-crs-claude-code

on:
  workflow_dispatch:
    inputs:
      harness:
        description: "Harness to target"
        required: false
        default: "parse_class"
      timeout:
        description: "Run budget in seconds (outer cap)"
        required: false
        default: "1500"

permissions: {}

concurrency:
  group: oss-crs-claude-code
  cancel-in-progress: false

jobs:
  bug-find:
    name: "Claude Code bug-finding (${{ github.event.inputs.harness }})"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read # the action pulls a PUBLIC runner image; no packages: read needed
    steps:
      - name: Require OAuth secret
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set. Run 'claude setup-token' and add it as a repo secret."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: scan
        # TEMP (rough-edge testing): a public STANDALONE (non-fork) dev repo +
        # the public puerco runner image. Switch to ossf/oss-crs-actions@<sha>
        # (default image) once that repo + its GHCR package are public.
        uses: puerco/oss-crs-temp@main
        with:
          crs: crs-bug-finding-claude-code
          harness: ${{ github.event.inputs.harness }}
          proj-path: oss-fuzz
          timeout: ${{ github.event.inputs.timeout }}
          fail-on-crash: "false"
          image: ghcr.io/puerco/oss-crs-runner:latest
          env: |
            CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Upload findings
        if: always() && steps.scan.outputs.artifacts-dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-crs-claude-code-${{ github.event.inputs.harness }}
          path: ${{ steps.scan.outputs.artifacts-dir }}
          if-no-files-found: ignore
