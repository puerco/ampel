##############################################################################
#                        CRS Compose Configuration                           #
#         crs-libfuzzer (bug-finding) — sized for GitHub-hosted runners      #
##############################################################################
# SPDX-FileCopyrightText: Copyright 2026 Carabiner Systems, Inc
# SPDX-License-Identifier: Apache-2.0
#
# Downsized from the upstream example (8 CPU / 32 GB) to fit a standard
# ubuntu-latest runner (4 vCPU / 16 GB). crs-libfuzzer is a pure fuzzer: no LLM,
# no API keys, no builder sidecar. If you move to a larger runner, widen the
# cpuset ranges and bump memory here.

# --- General Settings -------------------------------------------------------
run_env: local
docker_registry: local

# --- Infrastructure ---------------------------------------------------------
oss_crs_infra:
  cpuset: "0-1"
  memory: "6G"

# --- CRS (crs-libfuzzer) ----------------------------------------------------
crs-libfuzzer:
  cpuset: "2-3"
  memory: "6G"
